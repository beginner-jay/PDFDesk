name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[build]"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -v

      - name: Build Windows app
        run: pyinstaller --noconfirm --clean PDFDesk.spec

      - name: Smoke-test packaged app
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $app = Start-Process "dist/PDFDesk/PDFDesk.exe" -PassThru
          Start-Sleep -Seconds 3
          if ($app.HasExited) { throw "PDFDesk.exe exited during startup" }
          Stop-Process -Id $app.Id

      - name: Create ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release
          Compress-Archive -Path dist/PDFDesk -DestinationPath release/PDFDesk-Windows-x64.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PDFDesk-Windows-x64
          path: release/PDFDesk-Windows-x64.zip
          if-no-files-found: error
